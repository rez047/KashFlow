name: Build KashFlow mobile apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Mobile platform to build
        required: true
        type: choice
        default: all
        options:
          - all
          - android
          - ios
      profile:
        description: EAS build profile
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  build:
    name: Queue ${{ inputs.platform }} ${{ inputs.profile }} build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check EAS configuration
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_PROJECT_ID" ]]; then
            echo "::error::Set the EXPO_PROJECT_ID repository variable to the existing EAS project ID."
            exit 1
          fi
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Set the EXPO_TOKEN repository secret. Do not put the token in source control."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm ci

      - name: Queue EAS build
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
