name: Build KashFlow mobile apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Mobile platform to build
        required: true
        type: choice
        default: all
        options:
          - all
          - android
          - ios
      profile:
        description: EAS build profile
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  android:
    name: Build Android ${{ inputs.profile }} package
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check EAS configuration
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_PROJECT_ID" ]]; then
            echo "::error::Set the EXPO_PROJECT_ID repository variable to the existing EAS project ID."
            exit 1
          fi
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Set the EXPO_TOKEN repository secret. Do not put the token in source control."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm ci

      - name: Build and download Android package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait --json > "$RUNNER_TEMP/eas-android-build.json"
          build_id="$(jq -r --arg platform android 'if type == "array" then .[] else . end | select((.platform // "" | ascii_downcase) == $platform) | .id' "$RUNNER_TEMP/eas-android-build.json" | head -n 1)"
          if [[ -z "$build_id" ]]; then
            echo "::error::EAS finished without returning an Android build ID."
            exit 1
          fi
          eas build:download --build-id "$build_id" --non-interactive --json > "$RUNNER_TEMP/eas-android-download.json"
          artifact_path="$(jq -r '.path // empty' "$RUNNER_TEMP/eas-android-download.json")"
          extension=apk
          if [[ "${{ inputs.profile }}" == "production" ]]; then extension=aab; fi
          if [[ ! -f "$artifact_path" || "$artifact_path" != *".$extension" ]]; then
            echo "::error::The Android build did not produce the expected .$extension package."
            exit 1
          fi
          cp -- "$artifact_path" "$GITHUB_WORKSPACE/KashFlow-Field-Android-${{ inputs.profile }}.$extension"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: kashflow-android-${{ inputs.profile }}-${{ github.run_id }}
          path: KashFlow-Field-Android-${{ inputs.profile }}.*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add Android build details
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          echo "## Android ${{ inputs.profile }} build" >> "$GITHUB_STEP_SUMMARY"
          echo "EAS build ID: `$BUILD_ID`" >> "$GITHUB_STEP_SUMMARY"
          echo "The package is attached to this GitHub Actions run for 30 days." >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: Build iOS ${{ inputs.profile }} package
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check EAS configuration
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_PROJECT_ID" ]]; then
            echo "::error::Set the EXPO_PROJECT_ID repository variable to the existing EAS project ID."
            exit 1
          fi
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Set the EXPO_TOKEN repository secret. Do not put the token in source control."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm ci

      - name: Build and download iOS package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive --wait --json > "$RUNNER_TEMP/eas-ios-build.json"
          build_id="$(jq -r --arg platform ios 'if type == "array" then .[] else . end | select((.platform // "" | ascii_downcase) == $platform) | .id' "$RUNNER_TEMP/eas-ios-build.json" | head -n 1)"
          if [[ -z "$build_id" ]]; then
            echo "::error::EAS finished without returning an iOS build ID."
            exit 1
          fi
          eas build:download --build-id "$build_id" --non-interactive --json > "$RUNNER_TEMP/eas-ios-download.json"
          artifact_path="$(jq -r '.path // empty' "$RUNNER_TEMP/eas-ios-download.json")"
          if [[ ! -f "$artifact_path" || "$artifact_path" != *.ipa ]]; then
            echo "::error::The iOS build did not produce an installable .ipa package."
            exit 1
          fi
          cp -- "$artifact_path" "$GITHUB_WORKSPACE/KashFlow-Field-iOS-${{ inputs.profile }}.ipa"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Upload iOS package
        uses: actions/upload-artifact@v7
        with:
          name: kashflow-ios-${{ inputs.profile }}-${{ github.run_id }}
          path: KashFlow-Field-iOS-${{ inputs.profile }}.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add iOS build details
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          echo "## iOS ${{ inputs.profile }} build" >> "$GITHUB_STEP_SUMMARY"
          echo "EAS build ID: `$BUILD_ID`" >> "$GITHUB_STEP_SUMMARY"
          echo "The package is attached to this GitHub Actions run for 30 days." >> "$GITHUB_STEP_SUMMARY"
