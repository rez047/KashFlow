name: Build KashFlow Field installers

# A stable `v*` tag publishes installers that the landing page can read directly.
# A `field-v*` tag still produces a draft release for manual signing review.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish (for example v1.2.0). Leave empty for build artifacts only.
        required: false
        type: string
  push:
    tags:
      - 'field-v*'
      - 'v*'

permissions:
  contents: read

jobs:
  desktop:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            script: build:win
          - platform: macos
            runner: macos-latest
            script: build:mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      # Report whether the signing material for this platform is present so the
      # publish step can decide between a public release and a draft.
      - name: Detect signing configuration (Windows)
        if: matrix.platform == 'windows'
        id: signing
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT)) {
            "available=false" >> $env:GITHUB_OUTPUT
            "::warning::No Windows code-signing certificate secret (WINDOWS_CSC_LINK) is configured. The installer will be published as unsigned or held as a draft."
          } else {
            "available=true" >> $env:GITHUB_OUTPUT
          }
      - name: Detect signing configuration (macOS)
        if: matrix.platform == 'macos'
        id: signing
        shell: bash
        env:
          CERT: ${{ secrets.MACOS_CSC_LINK }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$CERT" || -z "$NOTARY_APPLE_ID" || -z "$NOTARY_TEAM_ID" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing/notarization secrets (MACOS_CSC_LINK, APPLE_ID, APPLE_TEAM_ID) are not all configured. The DMG will be unsigned or held as a draft."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer (signed)
        if: steps.signing.outputs.available == 'true'
        run: npm run ${{ matrix.script }}
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_LINK || secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'

      - name: Build installer (unsigned draft)
        if: steps.signing.outputs.available != 'true'
        run: npm run ${{ matrix.script }}
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/KashFlow-Desktop-*-Setup.exe
            apps/desktop/release/KashFlow-Desktop-*-Setup.exe.blockmap
            apps/desktop/release/KashFlow-Desktop-*.dmg
            apps/desktop/release/KashFlow-Desktop-*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # A stable `v*` tag publishes the installers the landing page links to.
  publish-release:
    name: Publish stable release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish (or update) the GitHub release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag --title "KashFlow ${GITHUB_REF_NAME}" \
              --notes "KashFlow desktop installers for ${GITHUB_REF_NAME}. Windows (.exe) and macOS (.dmg) builds are attached for direct download."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # A `field-v*` tag keeps the original draft-for-signing-review behaviour.
  draft-release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/field-v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop installers
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft release for signing review
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --draft
          --title "KashFlow Field ${GITHUB_REF_NAME#field-}"
          --notes "Draft installers for signing and review. These builds are unsigned; sign and notarize them before publishing to customers."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
