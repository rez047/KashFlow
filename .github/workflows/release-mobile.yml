name: Attach mobile apps to release

# Publishes the signed Android APK (installable directly from the landing page)
# and, when public store links are configured, surfaces the iOS App Store link.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the mobile package to (for example v1.2.0).
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check EAS configuration
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_PROJECT_ID" ]]; then
            echo "::error::Set the EXPO_PROJECT_ID repository variable to the existing EAS project ID."
            exit 1
          fi
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Set the EXPO_TOKEN repository secret. Do not put the token in source control."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm ci

      # The `preview` profile produces an installable signed APK. The landing page
      # matches the asset by the exact KashFlow-Field-Android-*.apk name below.
      - name: Build and download Android APK
        id: build
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/eas-android-build.json"
          build_id="$(jq -r --arg platform android 'if type == "array" then .[] else . end | select((.platform // "" | ascii_downcase) == $platform) | .id' "$RUNNER_TEMP/eas-android-build.json" | head -n 1)"
          if [[ -z "$build_id" ]]; then
            echo "::error::EAS finished without returning an Android build ID."
            exit 1
          fi
          eas build:download --build-id "$build_id" --non-interactive --json > "$RUNNER_TEMP/eas-android-download.json"
          artifact_path="$(jq -r '.path // empty' "$RUNNER_TEMP/eas-android-download.json")"
          if [[ ! -f "$artifact_path" || "$artifact_path" != *.apk ]]; then
            echo "::error::The Android preview build did not produce an installable .apk package."
            exit 1
          fi
          cp -- "$artifact_path" "$GITHUB_WORKSPACE/KashFlow-Field-Android-${{ github.ref_name }}.apk"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Upload Android package artifact
        uses: actions/upload-artifact@v7
        with:
          name: kashflow-android-${{ github.ref_name }}-${{ github.run_id }}
          path: KashFlow-Field-Android-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Attach APK to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$GITHUB_WORKSPACE/KashFlow-Field-Android-${{ github.ref_name }}.apk" --clobber
          echo "Attached the Android APK to the $TAG release." >> "$GITHUB_STEP_SUMMARY"
          echo "Add the URL shown by Apple/Google to the VITE_IOS_DISTRIBUTION_URL / VITE_ANDROID_DISTRIBUTION_URL site settings when public store listings exist." >> "$GITHUB_STEP_SUMMARY"
