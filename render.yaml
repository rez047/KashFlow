services:
  - type: web
    name: kashflow-api
    runtime: node
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYROLL_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://kashflow-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kashflow-db
          property: connectionString
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MONO_PUBLIC_KEY
        sync: false
      - key: MONO_SECRET_KEY
        sync: false
      - key: MONO_WEBHOOK_SECRET
        sync: false
      - key: MONO_SYNC_INTERVAL_MINUTES
        value: "60"
      - key: KRA_ETIMS_ENV
        value: sandbox
      - key: KRA_ETIMS_LIVE_ENABLED
        value: "false"
      - key: KRA_ETIMS_CREDENTIALS_ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: kashflow-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kashflow-api.onrender.com

databases:
  - name: kashflow-db
    databaseName: kashflow
    user: kashflow
    plan: free
