services:
  - type: web
    name: kashflow-api
    runtime: node
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://kashflow.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kashflow-db
          property: connectionString

  - type: web
    name: kashflow
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

databases:
  - name: kashflow-db
    databaseName: kashflow
    user: kashflow
    plan: basic-256mb
