services:
  - type: web
    name: kashflow-api
    runtime: node
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://kashflow-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: kashflow-db
          property: connectionString

  - type: web
    name: kashflow-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kashflow-api.onrender.com

databases:
  - name: kashflow-db
    databaseName: kashflow
    user: kashflow
    plan: basic-256mb
